# Publications, newest first.
#
# Fields:
#   title, authors (HTML allowed; wrap yourself in <strong>), venue, year
#   badge      - short label shown on the image, e.g. "CVPR 2026"
#   image      - teaser image (also used as the video poster)
#   video      - optional looping mp4 shown instead of the image
#   preprint   - true to list under "Preprints" instead of "Publications"
#   project, paper, code, bibtex - optional links
#   links      - optional extra links, e.g. [{name: Video, url: "https://..."}]
#   summary    - one-sentence description
#
# Author markers: <sup>*</sup> equal contribution, <sup>†</sup> corresponding author.

